<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAP Sales Cloud Insights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      font-family: 'Heebo', 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 20px;
    }

    /* ── Panel ── */
    #panel {
      width: 450px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    /* ── Header ── */
    #panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
      color: #fff;
      gap: 8px;
    }
    #panel-header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .3px;
      flex: 1;
    }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      background: rgba(255,255,255,.18);
      border: none;
      border-radius: 8px;
      color: #fff;
      width: 32px; height: 32px;
      cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,.32); }
    #refresh-btn.spinning svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Status bar ── */
    #status-bar {
      display: flex;
      gap: 12px;
      padding: 8px 16px;
      background: #f8f9fa;
      border-bottom: 1px solid #e8eaed;
      font-size: 11px;
      font-weight: 500;
    }
    .status-dot { display: flex; align-items: center; gap: 5px; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #bbb; flex-shrink: 0;
    }
    .dot.green  { background: #34a853; }
    .dot.red    { background: #ea4335; }
    .dot.yellow { background: #fbbc04; }

    /* ── Cards container ── */
    #cards-container {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      flex: 1;
    }

    /* ── Notification Card ── */
    .card {
      border-radius: 10px;
      padding: 12px 14px;
      border-left: 4px solid transparent;
      animation: fadeInUp .35s ease both;
    }
    [dir="rtl"] .card { border-left: none; border-right: 4px solid transparent; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card:nth-child(1) { animation-delay: .05s; }
    .card:nth-child(2) { animation-delay: .12s; }
    .card:nth-child(3) { animation-delay: .19s; }

    .card.red    { background: #fff5f5; border-color: #e53935; }
    .card.orange { background: #fff8f0; border-color: #f57c00; }
    .card.yellow { background: #fffde7; border-color: #f9a825; }

    .card-header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .card-icon   { font-size: 18px; line-height: 1; flex-shrink: 0; margin-top: 1px; }
    .card-title  { font-size: 13px; font-weight: 700; color: #202124; line-height: 1.3; }
    .card-body   { font-size: 12px; color: #3c4043; line-height: 1.5; margin-bottom: 8px; }
    .card-meta   { display: flex; flex-wrap: wrap; gap: 5px; }
    .meta-tag {
      font-size: 10px; font-weight: 600; padding: 2px 7px;
      border-radius: 20px; background: rgba(0,0,0,.06); color: #555;
    }

    /* ── Loading / Error states ── */
    .state-card { text-align: center; padding: 30px 20px; color: #5f6368; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #e8eaed;
      border-top-color: #1a73e8; border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 12px;
    }
    .state-card .err-icon  { font-size: 32px; margin-bottom: 10px; }
    .state-card p          { font-size: 13px; line-height: 1.5; }
    .err-detail { font-size: 11px; color: #ea4335; margin-top: 6px; word-break: break-all; }

    /* ── Modal overlay ── */
    #modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 1000;
      align-items: center; justify-content: center;
    }
    #modal-overlay.open { display: flex; }

    #settings-modal {
      background: #fff; border-radius: 16px;
      padding: 28px; width: 420px; max-width: 95vw;
      box-shadow: 0 12px 48px rgba(0,0,0,.25);
      animation: fadeInUp .25s ease;
    }
    #settings-modal h2 {
      font-size: 17px; font-weight: 700; margin-bottom: 20px; color: #202124;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      color: #5f6368; margin-bottom: 4px;
    }
    .field input {
      width: 100%; padding: 9px 12px; border: 1.5px solid #dadce0;
      border-radius: 8px; font-size: 13px; outline: none;
      transition: border-color .2s; font-family: inherit;
    }
    .field input:focus { border-color: #1a73e8; }

    /* Language toggle */
    .lang-toggle {
      display: flex; background: #f1f3f4; border-radius: 8px;
      padding: 3px; gap: 2px;
    }
    .lang-btn {
      flex: 1; padding: 7px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 13px; font-weight: 600;
      background: transparent; color: #5f6368; transition: all .2s;
      font-family: inherit;
    }
    .lang-btn.active { background: #fff; color: #1a73e8; box-shadow: 0 1px 4px rgba(0,0,0,.12); }

    .modal-actions {
      display: flex; gap: 10px; margin-top: 22px; justify-content: flex-end;
    }
    [dir="rtl"] .modal-actions { justify-content: flex-start; }

    .btn {
      padding: 9px 20px; border-radius: 8px; font-size: 13px;
      font-weight: 600; cursor: pointer; border: none; font-family: inherit;
      transition: all .2s;
    }
    .btn-secondary { background: #f1f3f4; color: #3c4043; }
    .btn-secondary:hover { background: #e8eaed; }
    .btn-primary   { background: #1a73e8; color: #fff; }
    .btn-primary:hover { background: #1557b0; }

    /* Scrollbar */
    #cards-container::-webkit-scrollbar { width: 5px; }
    #cards-container::-webkit-scrollbar-track { background: transparent; }
    #cards-container::-webkit-scrollbar-thumb { background: #dadce0; border-radius: 10px; }
  </style>
</head>
<body>

<!-- ── Floating Panel ── -->
<div id="panel">
  <div id="panel-header">
    <h1 id="panel-title">תובנות עסקיות – SAP Sales Cloud</h1>
    <div class="header-actions">
      <button class="icon-btn" id="refresh-btn" title="רענן">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
      <button class="icon-btn" id="settings-btn" title="הגדרות">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="status-bar">
    <div class="status-dot">
      <div class="dot" id="sap-dot"></div>
      <span id="sap-status-label">SAP</span>
    </div>
    <div class="status-dot">
      <div class="dot" id="gemini-dot"></div>
      <span id="gemini-status-label">Gemini AI</span>
    </div>
  </div>

  <div id="cards-container">
    <!-- populated by JS -->
  </div>
</div>

<!-- ── Settings Modal ── -->
<div id="modal-overlay">
  <div id="settings-modal">
    <h2 id="modal-title">⚙️ הגדרות חיבור</h2>

    <div class="field">
      <label id="lbl-url">SAP Base URL</label>
      <input type="url" id="sap-url" placeholder="https://my-tenant.crm.cloud.sap" />
    </div>
    <div class="field">
      <label id="lbl-user">שם משתמש SAP</label>
      <input type="text" id="sap-user" placeholder="username" autocomplete="username" />
    </div>
    <div class="field">
      <label id="lbl-pass">סיסמת SAP</label>
      <input type="password" id="sap-pass" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <div class="field">
      <label id="lbl-gemini">Gemini API Token</label>
      <input type="password" id="gemini-token" placeholder="AIza..." />
    </div>
    <div class="field">
      <label id="lbl-lang">שפה / Language</label>
      <div class="lang-toggle">
        <button class="lang-btn active" id="lang-he" data-lang="he">עברית 🇮🇱</button>
        <button class="lang-btn"        id="lang-en" data-lang="en">English 🇺🇸</button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancel-btn">ביטול</button>
      <button class="btn btn-primary"   id="save-btn">שמור</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
//  i18n
// ─────────────────────────────────────────────
const I18N = {
  he: {
    panelTitle:         'תובנות עסקיות – SAP Sales Cloud',
    modalTitle:         '⚙️ הגדרות חיבור',
    lblUrl:             'SAP Base URL',
    lblUser:            'שם משתמש SAP',
    lblPass:            'סיסמת SAP',
    lblGemini:          'Gemini API Token',
    lblLang:            'שפה / Language',
    save:               'שמור',
    cancel:             'ביטול',
    sapConnected:       'SAP מחובר',
    sapDisconnected:    'SAP לא מחובר',
    geminiConnected:    'Gemini מחובר',
    geminiDisconnected: 'Gemini לא מחובר',
    loading:            'טוען נתונים…',
    noSettings:         'נא להגדיר את פרטי החיבור',
    errFetch:           'שגיאה בטעינת נתונים',
    errAI:              'שגיאה בניתוח AI',
    refreshTitle:       'רענן',
    settingsTitle:      'הגדרות',
    noData:             'לא נמצאו רשומות פתוחות',
    promptLang:         'Hebrew',
  },
  en: {
    panelTitle:         'Business Insights – SAP Sales Cloud',
    modalTitle:         '⚙️ Connection Settings',
    lblUrl:             'SAP Base URL',
    lblUser:            'SAP Username',
    lblPass:            'SAP Password',
    lblGemini:          'Gemini API Token',
    lblLang:            'Language',
    save:               'Save',
    cancel:             'Cancel',
    sapConnected:       'SAP Connected',
    sapDisconnected:    'SAP Disconnected',
    geminiConnected:    'Gemini Connected',
    geminiDisconnected: 'Gemini Disconnected',
    loading:            'Loading data…',
    noSettings:         'Please configure connection settings',
    errFetch:           'Data fetch error',
    errAI:              'AI analysis error',
    refreshTitle:       'Refresh',
    settingsTitle:      'Settings',
    noData:             'No open records found',
    promptLang:         'English',
  }
};

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let cfg    = { sapUrl: '', sapUser: '', sapPass: '', geminiToken: '', lang: 'he' };
let sapOk  = false;
let gemOk  = false;

function loadCfg() {
  try { cfg = { ...cfg, ...JSON.parse(localStorage.getItem('sap_insights_cfg') || '{}') }; }
  catch(e) {}
}
function saveCfg() { localStorage.setItem('sap_insights_cfg', JSON.stringify(cfg)); }

// ─────────────────────────────────────────────
//  DOM refs
// ─────────────────────────────────────────────
const $panel     = document.getElementById('panel');
const $cards     = document.getElementById('cards-container');
const $overlay   = document.getElementById('modal-overlay');
const $sapDot    = document.getElementById('sap-dot');
const $sapLbl    = document.getElementById('sap-status-label');
const $gemDot    = document.getElementById('gemini-dot');
const $gemLbl    = document.getElementById('gemini-status-label');

// ─────────────────────────────────────────────
//  i18n apply
// ─────────────────────────────────────────────
function applyLang(lang) {
  cfg.lang = lang;
  const t   = I18N[lang];
  const rtl = lang === 'he';
  document.documentElement.lang = lang;
  document.documentElement.dir  = rtl ? 'rtl' : 'ltr';
  $panel.dir = rtl ? 'rtl' : 'ltr';
  document.getElementById('settings-modal').dir = rtl ? 'rtl' : 'ltr';

  document.getElementById('panel-title').textContent  = t.panelTitle;
  document.getElementById('modal-title').textContent  = t.modalTitle;
  document.getElementById('lbl-url').textContent      = t.lblUrl;
  document.getElementById('lbl-user').textContent     = t.lblUser;
  document.getElementById('lbl-pass').textContent     = t.lblPass;
  document.getElementById('lbl-gemini').textContent   = t.lblGemini;
  document.getElementById('lbl-lang').textContent     = t.lblLang;
  document.getElementById('save-btn').textContent     = t.save;
  document.getElementById('cancel-btn').textContent   = t.cancel;
  document.getElementById('refresh-btn').title        = t.refreshTitle;
  document.getElementById('settings-btn').title       = t.settingsTitle;

  document.getElementById('lang-he').classList.toggle('active', lang === 'he');
  document.getElementById('lang-en').classList.toggle('active', lang === 'en');
  updateStatus();
}

// ─────────────────────────────────────────────
//  Status bar
// ─────────────────────────────────────────────
function updateStatus() {
  const t = I18N[cfg.lang];
  $sapDot.className = 'dot ' + (sapOk ? 'green' : 'red');
  $gemDot.className = 'dot ' + (gemOk ? 'green' : 'red');
  $sapLbl.textContent = sapOk ? t.sapConnected    : t.sapDisconnected;
  $gemLbl.textContent = gemOk ? t.geminiConnected : t.geminiDisconnected;
}

// ─────────────────────────────────────────────
//  Render helpers
// ─────────────────────────────────────────────
const esc = s => String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function showLoading() {
  $cards.innerHTML = `
    <div class="state-card">
      <div class="spinner"></div>
      <p>${I18N[cfg.lang].loading}</p>
    </div>`;
}
function showError(title, detail) {
  $cards.innerHTML = `
    <div class="state-card">
      <div class="err-icon">⚠️</div>
      <p><strong>${esc(title)}</strong></p>
      ${detail ? `<p class="err-detail">${esc(detail)}</p>` : ''}
    </div>`;
}
function showNoSettings() {
  $cards.innerHTML = `
    <div class="state-card">
      <div class="err-icon">⚙️</div>
      <p>${I18N[cfg.lang].noSettings}</p>
    </div>`;
}
function showNoData() {
  $cards.innerHTML = `
    <div class="state-card">
      <div class="err-icon">✅</div>
      <p>${I18N[cfg.lang].noData}</p>
    </div>`;
}

const TYPE_ICON = { opportunity: '💼', quote: '📄', lead: '🎯', task: '📋' };

function renderCards(insights) {
  if (!insights || !insights.length) { showNoData(); return; }
  $cards.innerHTML = insights.slice(0, 3).map((ins, i) => {
    const cls  = { red: 'red', orange: 'orange', yellow: 'yellow' }[ins.severity] || 'yellow';
    const icon = TYPE_ICON[ins.type] || '📊';
    return `
      <div class="card ${cls}">
        <div class="card-header">
          <span class="card-icon">${icon}</span>
          <span class="card-title">${esc(ins.title)}</span>
        </div>
        <div class="card-body">${esc(ins.body)}</div>
        <div class="card-meta">
          ${ins.owner   ? `<span class="meta-tag">👤 ${esc(ins.owner)}</span>`   : ''}
          ${ins.account ? `<span class="meta-tag">🏢 ${esc(ins.account)}</span>` : ''}
        </div>
      </div>`;
  }).join('');
}

// ─────────────────────────────────────────────
//  SAP endpoints + filter logic
// ─────────────────────────────────────────────
const TODAY = new Date().toISOString().split('T')[0];

const ENDPOINTS = [
  {
    key:  'opportunities',
    path: '/sap/c4c/api/v1/opportunity-service/opportunities',
    type: 'opportunity',
    filter: r => {
      const st = String(r.LifeCycleStatusCode || r.StatusCode || r.status || '').toLowerCase();
      const cd = r.CloseDate || r.closeDate || '';
      const open = st === 'open' || st === '1' || st === 'y1' || st === '2';
      return open && (!cd || cd < TODAY);
    },
    extract: r => ({
      owner:   r.OwnerName || r.ResponsibleEmployeeName || r.OwnerUUID || '',
      account: r.AccountName || r.AccountPartyName || '',
      date:    r.CloseDate || r.closeDate || '',
      status:  r.LifeCycleStatusCode || r.StatusCode || '',
    })
  },
  {
    key:  'salesQuotes',
    path: '/sap/c4c/api/v1/sales-quote-service/salesQuotes',
    type: 'quote',
    filter: r => {
      const st = String(r.LifeCycleStatusCode || r.StatusCode || r.status || '').toLowerCase();
      return st === 'open' || st === '1' || st === 'y1' || st === '2';
    },
    extract: r => ({
      owner:   r.ResponsibleEmployeeName || r.OwnerName || '',
      account: r.AccountName || r.SoldToPartyName || '',
      date:    r.ValidityEndDate || r.ExpiryDate || '',
      status:  r.LifeCycleStatusCode || r.StatusCode || '',
    })
  },
  {
    key:  'leads',
    path: '/sap/c4c/api/v1/lead-service/leads',
    type: 'lead',
    filter: r => {
      const st = String(r.LifeCycleStatusCode || r.StatusCode || r.status || '').toLowerCase();
      return st === 'open' || st === '1' || st === 'y1' || st === '2';
    },
    extract: r => ({
      owner:   r.OwnerName || r.ResponsibleEmployeeName || '',
      account: r.AccountName || r.ProspectPartyName || '',
      date:    r.StartDate || r.CreatedOn || '',
      status:  r.LifeCycleStatusCode || r.StatusCode || '',
    })
  },
  {
    key:  'tasks',
    path: '/sap/c4c/api/v1/task-service/tasks',
    type: 'task',
    filter: r => {
      const st = String(r.StatusCode || r.LifeCycleStatusCode || r.status || '').toLowerCase();
      return st === 'open' || st === '1' || st === 'e0001' || st === 'y1';
    },
    extract: r => ({
      owner:   r.ProcessorName || r.OwnerName || '',
      account: r.AccountName  || r.ObjectName || '',
      date:    r.DueDate || r.PlannedEndDate || '',
      status:  r.StatusCode || r.LifeCycleStatusCode || '',
    })
  }
];

async function fetchEndpoint(base, auth, ep) {
  const url = `${base}${ep.path}?$top=50&$format=json`;
  const res = await fetch(url, {
    headers: { 'Authorization': auth, 'Accept': 'application/json' }
  });
  if (!res.ok) throw new Error(`HTTP ${res.status} on ${ep.key}`);
  const json = await res.json();
  const rows = json.value || (json.d && json.d.results) || [];
  return rows.filter(ep.filter).map(r => ({ type: ep.type, ...ep.extract(r) }));
}

// ─────────────────────────────────────────────
//  Gemini call
// ─────────────────────────────────────────────
async function callGemini(records) {
  const langName = I18N[cfg.lang].promptLang;
  const prompt = `You are a CRM business analyst. Analyze the following SAP Sales Cloud open records and return EXACTLY 3 actionable business insight notifications.

Rules:
- Go beyond raw counts — highlight patterns, names, urgency, risk (e.g. "3 overdue opportunities from Acme Corp, oldest by 14 days")
- severity: "red" = critical/overdue, "orange" = warning/aging, "yellow" = informational
- type: one of "opportunity", "quote", "lead", "task"
- ALL text (title, body) must be written in ${langName}
- Return ONLY a valid JSON array of exactly 3 objects — no markdown, no commentary

Schema per object:
{"title":"short headline","body":"1-2 sentence insight","owner":"person name or empty","account":"company name or empty","severity":"red|orange|yellow","type":"opportunity|quote|lead|task"}

Records:
${JSON.stringify(records, null, 2)}`;

  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${cfg.geminiToken}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.4, maxOutputTokens: 1024 }
      })
    }
  );
  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    throw new Error(`Gemini ${res.status}: ${errText.slice(0, 200)}`);
  }
  const data = await res.json();
  const raw  = data.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
  const clean = raw.replace(/```json?/gi, '').replace(/```/g, '').trim();
  return JSON.parse(clean);
}

// ─────────────────────────────────────────────
//  Main flow
// ─────────────────────────────────────────────
async function fetchAndAnalyze() {
  const t = I18N[cfg.lang];
  if (!cfg.sapUrl || !cfg.sapUser || !cfg.sapPass || !cfg.geminiToken) {
    showNoSettings(); return;
  }

  const refreshBtn = document.getElementById('refresh-btn');
  refreshBtn.classList.add('spinning');
  showLoading();
  sapOk = false; gemOk = false; updateStatus();

  const base = cfg.sapUrl.replace(/\/$/, '');
  const auth = 'Basic ' + btoa(cfg.sapUser + ':' + cfg.sapPass);

  const settled = await Promise.allSettled(ENDPOINTS.map(ep => fetchEndpoint(base, auth, ep)));
  let allRecords = [];
  settled.forEach((r, i) => {
    if (r.status === 'fulfilled') allRecords = allRecords.concat(r.value);
    else console.warn('[' + ENDPOINTS[i].key + ']', r.reason?.message);
  });

  sapOk = settled.some(r => r.status === 'fulfilled');
  updateStatus();

  if (!sapOk) {
    refreshBtn.classList.remove('spinning');
    const firstErr = settled.find(r => r.status === 'rejected')?.reason?.message;
    showError(t.errFetch, firstErr);
    return;
  }

  if (!allRecords.length) {
    gemOk = true; updateStatus();
    refreshBtn.classList.remove('spinning');
    showNoData(); return;
  }

  try {
    const insights = await callGemini(allRecords);
    gemOk = true; updateStatus();
    renderCards(insights);
  } catch(e) {
    console.error('Gemini:', e);
    gemOk = false; updateStatus();
    showError(t.errAI, e.message);
  }
  refreshBtn.classList.remove('spinning');
}

// ─────────────────────────────────────────────
//  Settings modal
// ─────────────────────────────────────────────
function openSettings() {
  document.getElementById('sap-url').value      = cfg.sapUrl;
  document.getElementById('sap-user').value     = cfg.sapUser;
  document.getElementById('sap-pass').value     = cfg.sapPass;
  document.getElementById('gemini-token').value = cfg.geminiToken;
  applyLang(cfg.lang);
  $overlay.classList.add('open');
}
function closeSettings() { $overlay.classList.remove('open'); }
function saveSettings() {
  cfg.sapUrl      = document.getElementById('sap-url').value.trim();
  cfg.sapUser     = document.getElementById('sap-user').value.trim();
  cfg.sapPass     = document.getElementById('sap-pass').value;
  cfg.geminiToken = document.getElementById('gemini-token').value.trim();
  saveCfg();
  closeSettings();
  fetchAndAnalyze();
}

// ─────────────────────────────────────────────
//  Event wiring
// ─────────────────────────────────────────────
document.getElementById('settings-btn').addEventListener('click', openSettings);
document.getElementById('refresh-btn').addEventListener('click', fetchAndAnalyze);
document.getElementById('save-btn').addEventListener('click', saveSettings);
document.getElementById('cancel-btn').addEventListener('click', closeSettings);
$overlay.addEventListener('click', e => { if (e.target === $overlay) closeSettings(); });
document.getElementById('lang-he').addEventListener('click', () => { applyLang('he'); });
document.getElementById('lang-en').addEventListener('click', () => { applyLang('en'); });

// ─────────────────────────────────────────────
//  Bootstrap
// ─────────────────────────────────────────────
loadCfg();
applyLang(cfg.lang);
if (!cfg.sapUrl || !cfg.sapUser || !cfg.sapPass || !cfg.geminiToken) {
  openSettings();
  showNoSettings();
} else {
  fetchAndAnalyze();
}
</script>
</body>
